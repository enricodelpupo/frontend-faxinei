services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: faxinei-frontend
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm run dev"
    networks:
      - faxinei-network
    restart: unless-stopped

networks:
  faxinei-network:
    driver: bridge
